services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - warehouse_data:/data
    environment:
      DATABASE_URL: sqlite:////data/warehouse.db
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: >-
        http://localhost:8080,
        http://127.0.0.1:8080,
        http://localhost:5173,
        http://127.0.0.1:5173,
        http://localhost:8000,
        http://127.0.0.1:8000

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  warehouse_data:
